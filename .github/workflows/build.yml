name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Submodules
        run: |
          git submodule update --init native/external/dobby
          git submodule update --init native/external/xdl
          git submodule update --init native/external/lsplant
          cd native/external/lsplant
          git checkout 7217ac6f41e2bda549e4acb54e632abb03e5ccaf
          git submodule update --init lsplant/src/main/jni/external/dex_builder
          cd lsplant/src/main/jni/external/dex_builder
          git submodule update --init external/parallel_hashmap
          cd ../../../../../../..

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build arm64-v8a
        run: |
          cmake -B build/arm64-v8a -S native \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static
          cmake --build build/arm64-v8a --config Release --parallel

      - name: Build armeabi-v7a
        run: |
          cmake -B build/armeabi-v7a -S native \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static
          cmake --build build/armeabi-v7a --config Release --parallel

      - name: Package Module ZIP
        run: |
          mkdir -p release/zygisk
          cp -r template/. release/
          cp build/arm64-v8a/libunlock_uwb.so release/zygisk/arm64-v8a.so
          cp build/armeabi-v7a/libunlock_uwb.so release/zygisk/armeabi-v7a.so
          
          cd release
          zip -r ../unlock-uwb-v1.0.0.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlock-uwb-v1.0.0
          path: unlock-uwb-v1.0.0.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: unlock-uwb-v1.0.0.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

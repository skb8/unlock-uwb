name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Helper DEX
        run: |
          mkdir -p build-tools
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          export D8_JAR="$(find $ANDROID_HOME/build-tools -name d8.jar | sort -V | tail -n1)"
          
          CLASSES="helper/classes"
          mkdir -p "$CLASSES" native/generated
          
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d "$CLASSES" helper/src/io/github/skb8/unlockuwb/helper/*.java
          java -cp "$D8_JAR" com.android.tools.r8.D8 --min-api 26 --output native/generated $(find "$CLASSES" -name '*.class')
          mv native/generated/classes.dex native/generated/helper.dex
          
          python3 - native/generated/helper.dex native/jni/helper_dex.h <<'PY'
          import sys
          data = open(sys.argv[1], 'rb').read()
          with open(sys.argv[2], 'w') as f:
              f.write("#pragma once\n#include <cstddef>\n")
              f.write("static const unsigned char kHelperDex[] = {")
              f.write(",".join(str(b) for b in data))
              f.write("};\n")
              f.write(f"static const size_t kHelperDexLen = {len(data)};\n")
          PY

      - name: Build arm64-v8a
        run: |
          cmake -B build/arm64-v8a -S native \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static
          cmake --build build/arm64-v8a --config Release --parallel

      - name: Build armeabi-v7a
        run: |
          cmake -B build/armeabi-v7a -S native \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static
          cmake --build build/armeabi-v7a --config Release --parallel

      - name: Package Module ZIP
        run: |
          mkdir -p release/zygisk
          cp -r template/* release/
          cp build/arm64-v8a/libunlock_uwb.so release/zygisk/arm64-v8a.so
          cp build/armeabi-v7a/libunlock_uwb.so release/zygisk/armeabi-v7a.so
          
          cd release
          zip -r ../unlock-uwb-v1.0.0.zip *
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlock-uwb-v1.0.0
          path: unlock-uwb-v1.0.0.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: unlock-uwb-v1.0.0.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
